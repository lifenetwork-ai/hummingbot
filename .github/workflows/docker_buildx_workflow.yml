name: Client Docker Buildx Workflow

on:
  pull_request:
    types: [closed]
    branches:
      - master
      - development
  release:
    types: [published, edited]

permissions:
  contents: read

jobs:
  check_pr_files:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      has_backend_changes: ${{ steps.changed_files.outputs.has_backend_changes }}
    steps:
      - name: Check merged pull request files
        id: changed_files
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            if (files.length === 0 || files.length >= 3000) {
              throw new Error(`Cannot safely classify ${files.length} changed files`);
            }

            const touchesBackend = (filename) =>
              typeof filename === 'string' &&
              !filename.startsWith('dashboard/') &&
              filename !== '.github/workflows/frontend.yml';
            const hasBackendChanges = files.some((file) =>
              touchesBackend(file.filename) || touchesBackend(file.previous_filename)
            );

            core.setOutput('has_backend_changes', String(hasBackendChanges));

  build_pr:
    needs: check_pr_files
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && needs.check_pr_files.outputs.has_backend_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Development Image
        if: github.base_ref == 'development'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: hummingbot/hummingbot:development

      - name: Build and push Latest Image
        if: github.base_ref == 'master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: hummingbot/hummingbot:latest

  build_release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract tag name
        id: get_tag
        run: echo "VERSION=version-${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: hummingbot/hummingbot:${{ steps.get_tag.outputs.VERSION }}
