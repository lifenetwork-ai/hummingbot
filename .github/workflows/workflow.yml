name: ci

on:
  push:
    branches: [dev, master, development, 'refactor/unit_tests**', 'epic/**']
    paths-ignore:
      - 'dashboard/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [dev, master, development, 'refactor/unit_tests**', 'epic/**']
    types: [ready_for_review, opened, synchronize, reopened]
    paths-ignore:
      - 'dashboard/**'
      - '.github/workflows/frontend.yml'

env:
  OFFLINE_E2E_SHARD_COUNT: '3'

jobs:
  postgres_integration:
    name: PostgreSQL integration (${{ matrix.shard }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
      - name: Restore Conda packages
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/conda-packages
          key: ${{ runner.os }}-${{ runner.arch }}-conda-packages-${{ hashFiles('setup/environment.yml', '.github/actions/install_env_and_hb/action.yml') }}
      - name: Install environment and Hummingbot
        uses: ./.github/actions/install_env_and_hb
      - name: Run isolated PostgreSQL shard
        env:
          POSTGRES_TEST_SHARD: ${{ matrix.shard }}
        run: python scripts/test_postgres.py --postgres-shard "$POSTGRES_TEST_SHARD" --durations=20

  stable_tests:
    name: Stable tests and coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Use cache's hashFiles function to check for changes in core code
      - name: Check for code changes
        id: program-changes
        uses: actions/cache@v5
        env:
          # Increase this value to manually reset cache if program files have not changed
          CACHE_NUMBER: 0
        with:
          path: README.md # placeholder file
          key: ${{ runner.os }}-build-${{ env.CACHE_NUMBER }}-${{ hashFiles('hummingbot/*', '**/*.py', '**/*.py*', '**/*.pxd', '**/*.sql', 'test/*') }}

      # Recreate the environment on each runner using the cached packages.
      - name: Cache Conda packages
        id: conda-dependencies
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/conda-packages
          key: ${{ runner.os }}-${{ runner.arch }}-conda-packages-${{ hashFiles('setup/environment.yml', '.github/actions/install_env_and_hb/action.yml') }}

      # Install environment and Hummingbot
      - name: Install environment and Hummingbot
        uses: ./.github/actions/install_env_and_hb

      # Only the pre-commit checks are conditional on code changes.
      - name: Run pre-commit hooks on diff
        if: steps.program-changes.outputs.cache-hit != 'true' || steps.conda-dependencies.outputs.cache-hit != 'true'
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pre-commit run --files $(git diff --name-only origin/${{ github.base_ref }})
          else
            pre-commit run --files $(git diff --name-only HEAD~1)
          fi

      - name: Run stable tests and calculate coverage
        run: |
          PYTEST_ADDOPTS="-rs --durations=20 --junitxml=$RUNNER_TEMP/backend-tests.xml" make test
          python - "$RUNNER_TEMP/backend-tests.xml" <<'PY'
          import sys
          from xml.etree import ElementTree

          skipped = ElementTree.parse(sys.argv[1]).findall('.//testcase[skipped]')
          for case in skipped:
              reason = case.find('skipped').get('message', 'skipped')
              print(f"{case.get('classname')}.{case.get('name')}: {reason}")
          if skipped:
              raise SystemExit(f'{len(skipped)} test(s) skipped in the stable backend suite.')
          PY

      - name: Admin OpenAPI contract drift check
        run: make swagger-backend-check

      - name: PostgreSQL port regression (required)
        run: make test-cloudrun-regression

      - name: Review Cloud Run deployment template
        run: python scripts/review_cloudrun.py deploy/cloudrun/service.example.yaml --template

      - name: Check and report global coverage
        run: make report_coverage

      - name: Validate coverage for the changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --all -q
          git checkout -b $GITHUB_SHA
          coverage xml
          diff-cover --compare-branch=origin/$GITHUB_BASE_REF --fail-under=80 coverage.xml

      # Notify results to discord
      - name: Discord Webhook Action
        id: discord-direct-webhook
        if: always() && github.event_name == 'pull_request' && hashFiles('build_report.json') != ''
        continue-on-error: true
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          raw-data: build_report.json

      # Notify results to discord
      - uses: ruby/setup-ruby@v1
        if: github.event_name != 'pull_request' && steps.discord-direct-webhook.outcome == 'failure'
      - name: Send Webhook Notification
        if: github.event_name != 'pull_request' && steps.discord-direct-webhook.outcome == 'failure'
        env:
          JOB_STATUS: ${{ job.status }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          HOOK_OS_NAME: ${{ runner.os }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          git clone --depth 1 https://github.com/DiscordHooks/github-actions-discord-webhook.git webhook
          bash webhook/send.sh $JOB_STATUS $WEBHOOK_URL
        shell: bash

  cloudrun_image:
    name: Build Cloud Run test image
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Restore image for a rerun
        id: cloudrun_image_cache
        uses: actions/cache/restore@v5
        with:
          key: ci-cloudrun-image-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/cloudrun-image
          lookup-only: true
      - name: Build and archive the shared image
        if: steps.cloudrun_image_cache.outputs.cache-hit != 'true'
        run: |
          make build-cloudrun
          mkdir -p "$RUNNER_TEMP/cloudrun-image"
          docker image inspect --format '{{.Id}}' hummingbot-cloudrun:local > "$RUNNER_TEMP/cloudrun-image/image-id"
          docker save hummingbot-cloudrun:local | gzip -1 > "$RUNNER_TEMP/cloudrun-image/image.tar.gz"
          cp build/cloudrun-image.json "$RUNNER_TEMP/cloudrun-image/"
      - name: Transfer the image bundle to the E2E runners
        if: steps.cloudrun_image_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          key: ci-cloudrun-image-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/cloudrun-image

  offline_e2e:
    name: Cloud Run offline E2E (${{ matrix.shard }}/3)
    needs: cloudrun_image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v6
      - name: Restore the image from this workflow run
        uses: actions/cache/restore@v5
        with:
          key: ci-cloudrun-image-${{ github.run_id }}-${{ github.sha }}
          path: ${{ runner.temp }}/cloudrun-image
          fail-on-cache-miss: true
      - name: Load the built image and prefetch offline infrastructure
        env:
          CLOUDRUN_PREVIOUS_IMAGE: ${{ vars.HBOT_PREVIOUS_COMPATIBLE_IMAGE }}
        run: |
          image_bundle="$RUNNER_TEMP/cloudrun-image"
          docker load --input "$image_bundle/image.tar.gz"
          test "$(docker image inspect --format '{{.Id}}' hummingbot-cloudrun:local)" = "$(cat "$image_bundle/image-id")"
          mkdir -p build
          cp "$image_bundle/cloudrun-image.json" build/
          docker pull postgres:14-alpine
          docker pull registry:2
          if [ -n "$CLOUDRUN_PREVIOUS_IMAGE" ]; then docker pull "$CLOUDRUN_PREVIOUS_IMAGE"; fi
      - name: Restore Conda packages
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/conda-packages
          key: ${{ runner.os }}-${{ runner.arch }}-conda-packages-${{ hashFiles('setup/environment.yml', '.github/actions/install_env_and_hb/action.yml') }}
      - name: Install environment and Hummingbot
        uses: ./.github/actions/install_env_and_hb
      - name: Run offline E2E shard
        env:
          CLOUDRUN_PREVIOUS_IMAGE: ${{ vars.HBOT_PREVIOUS_COMPATIBLE_IMAGE }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: make test-e2e-offline OFFLINE_E2E_SHARD="$SHARD_INDEX/$OFFLINE_E2E_SHARD_COUNT"
      - name: Retain shard logs and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-cloudrun-offline-shard-${{ matrix.shard }}
          overwrite: true
          path: |
            build/e2e-offline/
            build/cloudrun-image.json

  build_hummingbot:
    name: Hummingbot build + stable tests
    needs: [postgres_integration, stable_tests, cloudrun_image, offline_e2e]
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Require every backend job
        env:
          POSTGRES_RESULT: ${{ needs.postgres_integration.result }}
          STABLE_RESULT: ${{ needs.stable_tests.result }}
          IMAGE_RESULT: ${{ needs.cloudrun_image.result }}
          E2E_RESULT: ${{ needs.offline_e2e.result }}
        run: |
          printf 'PostgreSQL: %s\nStable: %s\nImage: %s\nE2E: %s\n' "$POSTGRES_RESULT" "$STABLE_RESULT" "$IMAGE_RESULT" "$E2E_RESULT"
          test "$POSTGRES_RESULT/$STABLE_RESULT/$IMAGE_RESULT/$E2E_RESULT" = success/success/success/success
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: postgres-cloudrun-offline-shard-*
          path: build/e2e-offline/shards
      - name: Verify complete offline E2E evidence
        env:
          CLOUDRUN_PREVIOUS_IMAGE: ${{ vars.HBOT_PREVIOUS_COMPATIBLE_IMAGE }}
        run: |
          upgrade=()
          if [ -n "$CLOUDRUN_PREVIOUS_IMAGE" ]; then upgrade=(--require-upgrade); fi
          python3 -m scripts.merge_offline_e2e --shard-count "$OFFLINE_E2E_SHARD_COUNT" "${upgrade[@]}" \
            --output build/e2e-offline/result.json build/e2e-offline/shards/*/e2e-offline/*/result.json
          cp build/e2e-offline/shards/postgres-cloudrun-offline-shard-1/cloudrun-image.json build/
      - name: Retain offline E2E evidence
        uses: actions/upload-artifact@v7
        with:
          name: postgres-cloudrun-offline-evidence
          overwrite: true
          if-no-files-found: error
          path: |
            build/e2e-offline/
            build/cloudrun-image.json
