name: "Install environment and Hummingbot"
description: "Installs conda environment, all libraries and compiles Hummingbot"
runs:
  using: "composite"
  steps:
    - name: Set up Miniforge and the Hummingbot environment
      uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
      with:
        miniforge-version: '26.9.4-2'
        python-version: '3.13'
        environment-file: setup/environment.yml
        activate-environment: hummingbot
        pkgs-dirs: ${{ runner.temp }}/conda-packages

    - name: Compile Hummingbot
      shell: bash -el {0}
      env:
        WITHOUT_CYTHON_OPTIMIZATIONS: 'true'
      run: |
        test "${CONDA_DEFAULT_ENV:-}" = hummingbot
        site_packages="$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
        printf '%s\n' "$PWD" > "$site_packages/hummingbot-checkout.pth"
        python -m pip install --no-deps -r setup/pip_packages.txt
        ./compile
        ln -sf "$PWD/bin/hbot" "$CONDA_PREFIX/bin/hbot"
