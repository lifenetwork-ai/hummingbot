# Replace every REPLACE_* value and review before running a deployment command.
# Region proposal: asia-southeast1. Verify actual exchange access/allowlists there.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: REPLACE_SERVICE_NAME
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: 'false'
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cloudsql-instances: REPLACE_PROJECT:asia-southeast1:REPLACE_SQL_INSTANCE
    spec:
      serviceAccountName: REPLACE_SERVICE_ACCOUNT
      containerConcurrency: 8
      timeoutSeconds: 60
      containers:
        - image: REPLACE_REGISTRY_IMAGE@sha256:REPLACE_TESTED_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '2'
              memory: 2Gi
          env:
            - name: ENV
              value: production
            # Explicit exchange routing, independent of ENV/Swagger.
            # For Demo, use demo and the matching *_DEMO_* secret variable names.
            - name: OKX_TRADING_ENV
              value: live
            - name: OKX_SITE
              value: www
            - name: LOG_FORMAT
              value: json
            - name: LOG_LEVEL
              value: INFO
            - name: MM_NO_QUOTE_WARNING_SECONDS
              value: '120'
            - name: STORAGE_BACKEND
              value: postgres
            - name: BOT_ID
              value: hummingbot
            - name: ENABLE_AUTO_MIGRATION
              value: 'true'
            # Per-instance total: API 2, engine the remainder (including owner).
            # No overflow; the parent opens no database connections.
            - name: DB_POOL_SIZE
              value: '5'
            - name: ADMIN_API_ENABLED
              value: 'true'
            - name: ADMIN_STATISTICS_CACHE_TTL_SECONDS
              value: '15'
            - name: ADMIN_API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: REPLACE_ADMIN_USERNAME_SECRET
                  key: '1'
            - name: ADMIN_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: REPLACE_ADMIN_PASSWORD_SECRET
                  key: '1'
            # Server-to-server FE gateway is proposed for this internal service.
            # For direct browser access, review ingress/IAM and exact FE origins.
            - name: ADMIN_CORS_ORIGINS
              value: '*'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_DATABASE_URL_SECRET
                  key: '1'
            - name: HBOT_OKX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: REPLACE_OKX_KEY_SECRET
                  key: '1'
            - name: HBOT_OKX_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: REPLACE_OKX_SECRET_SECRET
                  key: '1'
            - name: HBOT_OKX_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: REPLACE_OKX_PASSPHRASE_SECRET
                  key: '1'
            # Remove this trio for a spot-only deployment with no perpetual use.
            - name: HBOT_OKX_PERPETUAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: REPLACE_OKX_PERPETUAL_KEY_SECRET
                  key: '1'
            - name: HBOT_OKX_PERPETUAL_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: REPLACE_OKX_PERPETUAL_SECRET_SECRET
                  key: '1'
            - name: HBOT_OKX_PERPETUAL_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: REPLACE_OKX_PERPETUAL_PASSPHRASE_SECRET
                  key: '1'
          startupProbe:
            httpGet:
              path: /startup
              port: 8080
            periodSeconds: 4
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
