# Replace every REPLACE_* value and review before running a deployment command.
# Region proposal: asia-southeast1. Verify actual exchange access/allowlists there.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: REPLACE_SERVICE_NAME
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: 'false'
        autoscaling.knative.dev/minScale: '1'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cloudsql-instances: REPLACE_PROJECT:asia-southeast1:REPLACE_SQL_INSTANCE
    spec:
      serviceAccountName: REPLACE_SERVICE_ACCOUNT
      containerConcurrency: 8
      timeoutSeconds: 60
      containers:
        - image: REPLACE_REGISTRY_IMAGE@sha256:REPLACE_TESTED_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 2Gi
          env:
            - name: STORAGE_BACKEND
              value: postgres
            - name: BOT_ID
              value: hummingbot
            - name: ENABLE_AUTO_MIGRATION
              value: 'true'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: REPLACE_DATABASE_URL_SECRET
                  key: '1'
            - name: HBOT_OKX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: REPLACE_OKX_KEY_SECRET
                  key: '1'
            - name: HBOT_OKX_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: REPLACE_OKX_SECRET_SECRET
                  key: '1'
            - name: HBOT_OKX_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: REPLACE_OKX_PASSPHRASE_SECRET
                  key: '1'
          startupProbe:
            httpGet:
              path: /startup
              port: 8080
            periodSeconds: 4
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
