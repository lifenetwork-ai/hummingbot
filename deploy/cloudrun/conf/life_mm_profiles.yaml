# Default catalogue. Review instrument availability, price bounds and budgets before use.
# Loading this file does not start a session or authorize trading.
reference_connector: okx
min_duration_seconds: 60
default_duration_seconds: 3600
max_duration_seconds: 86400
# Permission only; sessions still default to timed and require an explicit Start.
allow_until_stopped: true
max_total_amount_quote: "200"
# Optional USDT drawdown from the covered V2 report peak; null disables.
# Once armed, policy and peaks persist across sessions/restarts. See docs/life-mm-drawdown.md.
max_global_drawdown_quote: null
max_controller_drawdown_quote: null
# Optional rolling spot USDT outflow. Explicit window/cap/fee allowance required.
spot_outflow: null
# Profile IDs match their scenario names. Reference pairs remain configurable.
profiles:
  follow_market:
    scenario: follow_market
    references:
      - pair: BTC-USDT
        weight: "0.6"
      - pair: ETH-USDT
        weight: "0.4"
  sideways:
    scenario: sideways
    anchor: session_start_mid
  follow_token:
    scenario: follow_token
    references:
      - pair: BTC-USDT
        weight: "1"
# Defaults used when an API command sets selection: random.
random:
  profile_ids:
    - follow_market
    - sideways
    - follow_token
  # Run each selected profile for 600 seconds (10 minutes), then pick again.
  step_duration_seconds: 600
markets:
  spot:
    id: life_spot
    controller_type: market_making
    controller_name: life_mm
    connector_name: okx
    trading_pair: LIFE-USDT
    total_amount_quote: "100"
    buy_spreads: [0.01, 0.02]
    sell_spreads: [0.01, 0.02]
    # Optional fee/NATR spreads. Fixed spreads above remain the default.
    # See docs/life-mm-spread-policy.md for explicit static fallback settings.
    spread_policy:
      fee_floor: false
      volatility:
        enabled: false
    executor_refresh_time: 60
    cooldown_time: 15
    leverage: 1
    min_price: "0.000001"
    max_price: "1000"
    max_base_inventory: "10000"
    # Optional PMM sizing only; existing balance/exposure/outflow caps still apply.
    inventory_skew:
      enabled: false
      target_base_pct: "0.5"
      inventory_range_multiplier: "1"
    # Opt-in only. Enabled strict mode also requires explicit deviation/resume
    # thresholds; see docs/life-mm-quote-guards.md. No production risk defaults.
    quote_guards:
      enabled: false
  perpetual:
    id: life_perpetual
    controller_type: market_making
    controller_name: life_mm
    connector_name: okx_perpetual
    trading_pair: LIFE-USDT
    total_amount_quote: "100"
    buy_spreads: [0.01, 0.02]
    sell_spreads: [0.01, 0.02]
    # Optional fee/NATR spreads. Fixed spreads above remain the default.
    # See docs/life-mm-spread-policy.md for explicit static fallback settings.
    spread_policy:
      fee_floor: false
      volatility:
        enabled: false
    executor_refresh_time: 60
    cooldown_time: 15
    leverage: 2
    position_mode: HEDGE
    margin_mode: CROSS
    min_price: "0.000001"
    max_price: "1000"
    max_long_base: "10000"
    max_short_base: "10000"
    max_gross_base: "15000"
    quote_guards:
      enabled: false
